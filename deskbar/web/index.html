<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>deskbar 鬧鐘</title>
<style>
body{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;background:#111;color:#eee;
 max-width:480px;margin:0 auto;padding:20px}
h1{font-size:20px;font-weight:600}
.card{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.time{font-size:28px;font-variant-numeric:tabular-nums}
.days,.label{color:#9a9a9a;font-size:13px}
button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 14px}
button.del{color:#f09595}
input,label.d{font-size:16px}
input[type=time]{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:6px}
input[type=text]{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
.wk{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.wk label{background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:14px}
.wk input{margin-right:4px}
.off{opacity:.45}
h2{font-size:16px;font-weight:600;margin:24px 0 8px}
.cal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #2a2a2a}
.cal-row:first-of-type{border-top:none}
.cal-row label{font-size:15px;flex:1}
.cal-row input{width:20px;height:20px}
.acc-email{color:#9a9a9a;font-size:13px;margin-top:-4px}
.hint{color:#777;font-size:12px;margin:10px 2px 0}
</style></head><body>
<h1>deskbar</h1>
<h2 style="margin-top:8px">便條</h2>
<div class="card">
 <div class="row"><input type="text" id="nt" placeholder="閃念丟這裡，Enter 上牆"
  onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)addNote()">
 <button onclick="addNote()">上牆</button></div>
 <div class="hint">Mac 終端機：note 指令兩秒上牆（設定方式問 Claude）</div>
</div>
<div id="notes"></div>
<h2>鬧鐘</h2>
<div id="list"></div>
<div class="card">
 <div class="row"><input type="time" id="t" value="09:00"><input type="text" id="lb" placeholder="標籤（例如：打卡）"></div>
 <div class="wk" id="wk"></div>
 <button onclick="add()">新增鬧鐘</button>
</div>
<h2>日曆</h2>
<div id="cals"></div>
<h2>裝置設定</h2>
<div id="prefs"></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["一","二","三","四","五","六","日"];
const wk=document.getElementById("wk");
WD.forEach((w,i)=>{wk.insertAdjacentHTML("beforeend",
 `<label class="d"><input type="checkbox" value="${i}">${w}</label>`)});
async function load(){
 const as=await (await fetch("/api/alarms")).json();
 const td=new Date().toLocaleDateString("sv-SE");
 document.getElementById("list").innerHTML=as.map(a=>{
  const sk=a.skip_date===td;
  const off=!a.enabled||sk;
  const dt=(a.days.length?a.days.map(d=>"週"+WD[d]).join(" "):"一次性")+(sk?"（今天略過）":"");
  const sb=a.days.length?`<button onclick="skip('${esc(a.id)}',${sk?null:`'${td}'`})">${sk?"取消略過":"今天略過"}</button>`:"";
  return `<div class="card ${off?"off":""}"><div class="row">
   <div><div class="time">${esc(a.time)}</div>
   <div class="label">${esc(a.label)}</div>
   <div class="days">${dt}</div></div>
   <div>${sb}<button onclick="tog('${esc(a.id)}',${!a.enabled})">${a.enabled?"停用":"啟用"}</button>
   <button class="del" onclick="del('${esc(a.id)}')">刪除</button></div>
  </div></div>`;
 }).join("")||'<div class="card">尚無鬧鐘</div>';
}
async function add(){
 const days=[...wk.querySelectorAll("input:checked")].map(x=>+x.value);
 const r=await fetch("/api/alarms",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({time:document.getElementById("t").value,days,
  label:document.getElementById("lb").value})});
 if(!r.ok){alert("格式錯誤");return} document.getElementById("lb").value="";load();
}
async function tog(id,en){await fetch("/api/alarms/"+id,{method:"PATCH",
 headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:en})});load()}
async function skip(id,d){await fetch("/api/alarms/"+id,{method:"PATCH",
 headers:{"Content-Type":"application/json"},body:JSON.stringify({skip_date:d})});load()}
async function del(id){await fetch("/api/alarms/"+id,{method:"DELETE"});load()}
async function loadCals(){
 const box=document.getElementById("cals");
 const r=await fetch("/api/calendars");
 if(!r.ok){box.innerHTML='<div class="card">此功能需重新部署後啟用</div>';return}
 const accs=await r.json();
 box.innerHTML=(accs.map(a=>`
  <div class="card">
   <div>${esc(a.lane_label)}</div>
   <div class="acc-email">${esc(a.account)}</div>
   ${a.calendars.map(c=>`
    <div class="cal-row">
     <input type="checkbox" id="c_${esc(a.account)}_${esc(c.id)}" ${c.enabled?"checked":""}
      onchange="togCal('${esc(a.account)}','${esc(c.id)}',this.checked)">
     <label for="c_${esc(a.account)}_${esc(c.id)}">${esc(c.summary)}</label>
    </div>`).join("")}
  </div>`).join("")||'<div class="card">尚無帳號</div>')+
  '<div class="hint">變更於下次同步生效（最多 5 分鐘，可在螢幕點左下角立即同步）</div>';
}
async function togCal(account,calendarId,enabled){
 await fetch("/api/calendars",{method:"PATCH",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({account,calendar_id:calendarId,enabled})});
 loadCals();
}
const MIN_OPTS=Array.from({length:48},(_,i)=>i*30);
const fm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const sel=(id,opts,cur,f)=>`<select id="${id}">${opts.map(v=>
 `<option value="${v}" ${v===cur?"selected":""}>${f(v)}</option>`).join("")}</select>`;
async function loadPrefs(){
 const box=document.getElementById("prefs");
 const r=await fetch("/api/prefs");
 if(!r.ok){box.innerHTML='<div class="card">此功能需重新部署後啟用</div>';return}
 const p=await r.json();
 const pct=[...Array(10)].map((_,i)=>(i+1)*10);
 const spd=[[20,"快"],[30,"中"],[45,"慢"]];
 box.innerHTML=`<div class="card">
  <div class="cal-row">上班開始 ${sel("p_ws",MIN_OPTS,p.work_start_min,fm)}</div>
  <div class="cal-row">下班時間 ${sel("p_we",MIN_OPTS,p.work_end_min,fm)}（此後套用下班亮度）</div>
  <div class="cal-row">上班亮度 ${sel("p_bd",pct.filter(v=>v>=10),p.brightness_day,v=>v+"%")}</div>
  <div class="cal-row">下班亮度 ${sel("p_bn",pct,p.brightness_night,v=>v+"%")}</div>
  <div class="cal-row"><input type="checkbox" id="p_wa" ${p.weather_auto_locate?"checked":""}>
   <label for="p_wa">天氣自動定位（IP，目前：${p.weather_label||"—"}）</label></div>
  <div class="cal-row">改城市 <input type="text" id="p_city" placeholder="台北"
    style="width:110px"><button onclick="setCity()">定位</button>
   <span class="hint">IP 定位在雙北常差一區，手動指定最準</span></div>
  <div class="cal-row"><input type="checkbox" id="p_se" ${p.sleep_enabled?"checked":""}>
   <label for="p_se">深夜熄屏（時段內全黑，觸摸喚醒 30 秒）</label></div>
  <div class="cal-row">睡眠時段 ${sel("p_ss",MIN_OPTS,p.sleep_start_min,fm)} –
   ${sel("p_sn",MIN_OPTS,p.sleep_end_min,fm)}</div>
  <div class="cal-row"><input type="checkbox" id="p_pe" ${p.presence_enabled?"checked":""}>
   <label for="p_pe">在場感應（需先在螢幕上完成藍牙配對）</label></div>
  <div class="cal-row">感應速度 <select id="p_pi">${spd.map(([v,n])=>
   `<option value="${v}" ${v===p.presence_interval_sec?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="cal-row">同步頻率 ${sel("p_si",[1,3,5,10,30],p.sync_interval_min,v=>v+" 分鐘")}</div>
  <div class="cal-row" style="margin-top:10px"><b>氛圍場景</b>
   <select id="p_sm">${[["auto","自動（忙時進場景、閒時回便條）"],["manual","手動（只有自己切）"],
    ["force","強制（常駐場景，點畫面看 1 分鐘行事曆）"]].map(([v,n])=>
    `<option value="${v}" ${v===p.scene_mode?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="cal-row" style="display:flex;flex-wrap:wrap;gap:6px 14px">
   ${SCENE_NAMES.map(([k,n])=>`<label style="white-space:nowrap">
    <input type="checkbox" class="p_sc" value="${k}"
     ${(p.scenes_enabled||[]).includes(k)?"checked":""}> ${n}</label>`).join("")}
  </div>
  <div class="cal-row">Linear Key（${p.linear_key_set?"已設定":"未設定"}）
   <input type="password" id="p_lk" placeholder="lin_api_… 貼上後按存">
   <button onclick="saveKey()">存 Key</button></div>
  <button onclick="savePrefs()">儲存設定</button><span id="p_msg"></span>
  <div class="cal-row" style="margin-top:8px"><a href="/api/backup" download>下載設定備份</a>
   （含鬧鐘與便條；SD 卡故障時可對照重建）</div>
 </div>`;
}
const SCENE_NAMES=[["flow","流場墨線"],["stars","星河流星"],["ridges","呼吸山稜"],
 ["fireflies","螢火蟲"],["fish","水墨游魚"],["aurora","極光"],
 ["train","電車窗景"],["runner","像素冒險者"],["ink","墨滴暈染"],
 ["planet_horizon","行星地平線"]];
async function savePrefs(){
 const iv=+document.getElementById("p_pi").value;
 const grace={20:60,30:90,45:150}[iv]||150;
 const body={weather_auto_locate:document.getElementById("p_wa").checked,
  work_start_min:+document.getElementById("p_ws").value,
  work_end_min:+document.getElementById("p_we").value,
  brightness_day:+document.getElementById("p_bd").value,
  brightness_night:+document.getElementById("p_bn").value,
  sleep_enabled:document.getElementById("p_se").checked,
  sleep_start_min:+document.getElementById("p_ss").value,
  sleep_end_min:+document.getElementById("p_sn").value,
  presence_enabled:document.getElementById("p_pe").checked,
  presence_interval_sec:iv,presence_grace_sec:grace,
  sync_interval_min:+document.getElementById("p_si").value,
  scene_mode:document.getElementById("p_sm").value,
  scenes_enabled:[...document.querySelectorAll(".p_sc:checked")].map(c=>c.value)};
 const r=await fetch("/api/prefs",{method:"PATCH",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(r.ok){document.getElementById("p_msg").textContent=" 已儲存 ✓";setTimeout(loadPrefs,600);}
 else{let m="";try{m=(await r.json()).error||"";}catch(e){}
  document.getElementById("p_msg").textContent=" 儲存失敗"+(m?"："+m:"");}
}
async function setCity(){
 const q=document.getElementById("p_city").value.trim();
 if(!q){alert("輸入城市名，例如：台北");return}
 const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+
  encodeURIComponent(q)+"&language=zh&count=1");
 const d=r.ok?await r.json():{};
 if(!d.results||!d.results.length){alert("找不到這個城市");return}
 const g=d.results[0];
 const body={weather_auto_locate:false,weather_lat:g.latitude,weather_lon:g.longitude,
  weather_label:String(g.name||q).slice(0,12)};
 const rr=await fetch("/api/prefs",{method:"PATCH",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 document.getElementById("p_msg").textContent=rr.ok?" 已定位 "+body.weather_label+" ✓（自動定位已關）":" 失敗";
 if(rr.ok)setTimeout(loadPrefs,800);
}
async function saveKey(){
 const v=document.getElementById("p_lk").value.trim();
 if(!v){alert("先貼上 Key（在 Linear → Settings → Security & access → Personal API keys 建立）");return}
 const r=await fetch("/api/prefs",{method:"PATCH",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({linear_api_key:v})});
 document.getElementById("p_msg").textContent=r.ok?" Key 已儲存 ✓（5 分鐘內生效）":" 儲存失敗";
 if(r.ok)setTimeout(loadPrefs,600);
}
let NOTES=[],editingNote=null;
// 便利貼色盤（與裝置 notesview._STICKY 同一組色）；auto 輪色雜湊也與裝置同款，
// 卡片左緣色永遠等於牆上那張的顏色
const PAL=["#FFD65A","#FFA0B4","#78BEFF","#96E2A0","#C8AAFF"];
function autoIdx(id){let v=0;for(const ch of String(id)){v=(Math.imul(v,131)+ch.charCodeAt(0))>>>0}return v%PAL.length}
const noteColor=n=>PAL[(n.color>=0&&n.color<PAL.length)?n.color:autoIdx(n.id)];
async function setColor(id,ci){
 await fetch("/api/notes/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({color:ci})});
 loadNotes();
}
async function loadNotes(){
 const r=await fetch("/api/notes");
 if(!r.ok){document.getElementById("notes").innerHTML="";return}
 NOTES=await r.json();renderNotes();
}
function renderNotes(){
 document.getElementById("notes").innerHTML=NOTES.map((n,i)=>editingNote===n.id?`
  <div class="card note-card" data-id="${esc(n.id)}"><input type="text" id="ed_${esc(n.id)}" value="${esc(n.text)}"
    onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)saveEdit('${esc(n.id)}')">
   <div class="row" style="margin-top:8px;justify-content:flex-end">
    <button onclick="saveEdit('${esc(n.id)}')">存</button>
    <button onclick="editingNote=null;renderNotes()">取消</button></div></div>`:`
  <div class="card note-card" data-id="${esc(n.id)}" style="border-left:4px solid ${noteColor(n)}"><div class="row">
   <span class="drag" style="touch-action:none;cursor:grab;padding:4px 10px 4px 2px;color:#9a9a9a;font-size:18px;user-select:none"
    onpointerdown="dragStart(event)">☰</span>
   <span style="color:#9a9a9a;min-width:22px;font-variant-numeric:tabular-nums">${i+1}.</span>
   <div style="flex:1;white-space:pre-wrap">${esc(n.text)}</div>
   <div style="display:flex;gap:6px"><button onclick="editingNote='${esc(n.id)}';renderNotes()">編輯</button>
   <button class="del" onclick="delNote('${esc(n.id)}')">撕掉</button></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:8px;align-items:center">
   ${PAL.map((c,ci)=>`<span onclick="setColor('${esc(n.id)}',${ci})"
    style="width:20px;height:20px;border-radius:50%;background:${c};display:inline-block;cursor:pointer;box-sizing:border-box;border:2px solid ${n.color===ci?"#fff":"rgba(255,255,255,.15)"}"></span>`).join("")}
  </div></div>`).join("");
 const el=document.getElementById("ed_"+editingNote);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
// 拖動排序（順序＝優先序，第 1 張＝deskbar 牆左上）。用 Pointer Events 手做
// ——HTML5 DnD 在手機瀏覽器不動；把手 touch-action:none，其餘區域照常捲頁。
let dragEl=null;
function dragStart(e){
 if(editingNote)return;
 dragEl=e.target.closest(".note-card");
 dragEl.style.opacity=.55;
 e.preventDefault();
}
document.addEventListener("pointermove",e=>{
 if(!dragEl)return;
 e.preventDefault();
 for(const el of document.querySelectorAll(".note-card")){
  if(el===dragEl)continue;
  const r=el.getBoundingClientRect();
  if(e.clientY<r.top+r.height/2){el.before(dragEl);return}
 }
 const all=[...document.querySelectorAll(".note-card")];
 if(all.length)all[all.length-1].after(dragEl);
},{passive:false});
document.addEventListener("pointerup",async()=>{
 if(!dragEl)return;
 dragEl.style.opacity=1;dragEl=null;
 const order=[...document.querySelectorAll(".note-card")].map(el=>el.dataset.id);
 await fetch("/api/notes/reorder",{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({order})});
 loadNotes();
});
async function saveEdit(id){
 const v=document.getElementById("ed_"+id).value.trim();
 if(!v)return;
 const r=await fetch("/api/notes/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({text:v})});
 if(r.ok){editingNote=null;loadNotes()}
}
async function addNote(){
 const el=document.getElementById("nt");
 const v=el.value.trim();
 if(!v)return;
 const r=await fetch("/api/notes",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({text:v})});
 if(r.ok){el.value="";loadNotes()}
}
async function delNote(id){await fetch("/api/notes/"+id,{method:"DELETE"});loadNotes()}
load();
loadCals();
loadPrefs();
loadNotes();
</script></body></html>
