<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>deskbar 鬧鐘</title>
<style>
body{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;background:#111;color:#eee;
 max-width:480px;margin:0 auto;padding:20px}
h1{font-size:20px;font-weight:600}
.card{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.time{font-size:28px;font-variant-numeric:tabular-nums}
.days,.label{color:#9a9a9a;font-size:13px}
button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 14px}
button.del{color:#f09595}
input,label.d{font-size:16px}
input[type=time]{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:6px}
input[type=text]{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
.wk{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.wk label{background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:14px}
.wk input{margin-right:4px}
.off{opacity:.45}
h2{font-size:16px;font-weight:600;margin:24px 0 8px}
.cal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #2a2a2a}
.cal-row:first-of-type{border-top:none}
.cal-row label{font-size:15px;flex:1}
.cal-row input{width:20px;height:20px}
.acc-email{color:#9a9a9a;font-size:13px;margin-top:-4px}
.hint{color:#777;font-size:12px;margin:10px 2px 0}
</style></head><body>
<h1>deskbar</h1>
<h2 style="margin-top:8px">便條</h2>
<div class="card">
 <div class="row"><input type="text" id="nt" placeholder="閃念丟這裡，Enter 上牆"
  onkeydown="if(event.key==='Enter')addNote()">
 <button onclick="addNote()">上牆</button></div>
 <div class="hint">Mac 終端機：note 指令兩秒上牆（設定方式問 Claude）</div>
</div>
<div id="notes"></div>
<h2>鬧鐘</h2>
<div id="list"></div>
<div class="card">
 <div class="row"><input type="time" id="t" value="09:00"><input type="text" id="lb" placeholder="標籤（例如：打卡）"></div>
 <div class="wk" id="wk"></div>
 <button onclick="add()">新增鬧鐘</button>
</div>
<h2>日曆</h2>
<div id="cals"></div>
<h2>裝置設定</h2>
<div id="prefs"></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["一","二","三","四","五","六","日"];
const wk=document.getElementById("wk");
WD.forEach((w,i)=>{wk.insertAdjacentHTML("beforeend",
 `<label class="d"><input type="checkbox" value="${i}">${w}</label>`)});
async function load(){
 const as=await (await fetch("/api/alarms")).json();
 document.getElementById("list").innerHTML=as.map(a=>`
  <div class="card ${a.enabled?"":"off"}"><div class="row">
   <div><div class="time">${esc(a.time)}</div>
   <div class="label">${esc(a.label)}</div>
   <div class="days">${a.days.length? a.days.map(d=>"週"+WD[d]).join(" "):"一次性"}</div></div>
   <div><button onclick="tog('${esc(a.id)}',${!a.enabled})">${a.enabled?"停用":"啟用"}</button>
   <button class="del" onclick="del('${esc(a.id)}')">刪除</button></div>
  </div></div>`).join("")||'<div class="card">尚無鬧鐘</div>';
}
async function add(){
 const days=[...wk.querySelectorAll("input:checked")].map(x=>+x.value);
 const r=await fetch("/api/alarms",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({time:document.getElementById("t").value,days,
  label:document.getElementById("lb").value})});
 if(!r.ok){alert("格式錯誤");return} document.getElementById("lb").value="";load();
}
async function tog(id,en){await fetch("/api/alarms/"+id,{method:"PATCH",
 headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:en})});load()}
async function del(id){await fetch("/api/alarms/"+id,{method:"DELETE"});load()}
async function loadCals(){
 const box=document.getElementById("cals");
 const r=await fetch("/api/calendars");
 if(!r.ok){box.innerHTML='<div class="card">此功能需重新部署後啟用</div>';return}
 const accs=await r.json();
 box.innerHTML=(accs.map(a=>`
  <div class="card">
   <div>${esc(a.lane_label)}</div>
   <div class="acc-email">${esc(a.account)}</div>
   ${a.calendars.map(c=>`
    <div class="cal-row">
     <input type="checkbox" id="c_${esc(a.account)}_${esc(c.id)}" ${c.enabled?"checked":""}
      onchange="togCal('${esc(a.account)}','${esc(c.id)}',this.checked)">
     <label for="c_${esc(a.account)}_${esc(c.id)}">${esc(c.summary)}</label>
    </div>`).join("")}
  </div>`).join("")||'<div class="card">尚無帳號</div>')+
  '<div class="hint">變更於下次同步生效（最多 5 分鐘，可在螢幕點左下角立即同步）</div>';
}
async function togCal(account,calendarId,enabled){
 await fetch("/api/calendars",{method:"PATCH",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({account,calendar_id:calendarId,enabled})});
 loadCals();
}
const MIN_OPTS=Array.from({length:48},(_,i)=>i*30);
const fm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const sel=(id,opts,cur,f)=>`<select id="${id}">${opts.map(v=>
 `<option value="${v}" ${v===cur?"selected":""}>${f(v)}</option>`).join("")}</select>`;
async function loadPrefs(){
 const box=document.getElementById("prefs");
 const r=await fetch("/api/prefs");
 if(!r.ok){box.innerHTML='<div class="card">此功能需重新部署後啟用</div>';return}
 const p=await r.json();
 const pct=[...Array(10)].map((_,i)=>(i+1)*10);
 const spd=[[15,"快"],[30,"中"],[45,"慢"]];
 box.innerHTML=`<div class="card">
  <div class="cal-row">上班開始 ${sel("p_ws",MIN_OPTS,p.work_start_min,fm)}</div>
  <div class="cal-row">下班時間 ${sel("p_we",MIN_OPTS,p.work_end_min,fm)}（此後套用下班亮度）</div>
  <div class="cal-row">上班亮度 ${sel("p_bd",pct.filter(v=>v>=10),p.brightness_day,v=>v+"%")}</div>
  <div class="cal-row">下班亮度 ${sel("p_bn",pct,p.brightness_night,v=>v+"%")}</div>
  <div class="cal-row"><input type="checkbox" id="p_pe" ${p.presence_enabled?"checked":""}>
   <label for="p_pe">在場感應（需先在螢幕上完成藍牙配對）</label></div>
  <div class="cal-row">感應速度 <select id="p_pi">${spd.map(([v,n])=>
   `<option value="${v}" ${v===p.presence_interval_sec?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="cal-row">同步頻率 ${sel("p_si",[1,3,5,10,30],p.sync_interval_min,v=>v+" 分鐘")}</div>
  <div class="cal-row">Linear Key（${p.linear_key_set?"已設定":"未設定"}）
   <input type="password" id="p_lk" placeholder="lin_api_… 貼上後按存">
   <button onclick="saveKey()">存 Key</button></div>
  <button onclick="savePrefs()">儲存設定</button><span id="p_msg"></span>
 </div>`;
}
async function savePrefs(){
 const iv=+document.getElementById("p_pi").value;
 const grace={15:45,30:90,45:150}[iv]||150;
 const body={work_start_min:+document.getElementById("p_ws").value,
  work_end_min:+document.getElementById("p_we").value,
  brightness_day:+document.getElementById("p_bd").value,
  brightness_night:+document.getElementById("p_bn").value,
  presence_enabled:document.getElementById("p_pe").checked,
  presence_interval_sec:iv,presence_grace_sec:grace,
  sync_interval_min:+document.getElementById("p_si").value};
 const r=await fetch("/api/prefs",{method:"PATCH",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 document.getElementById("p_msg").textContent=r.ok?" 已儲存 ✓":" 儲存失敗";
 if(r.ok)setTimeout(loadPrefs,600);
}
async function saveKey(){
 const v=document.getElementById("p_lk").value.trim();
 if(!v){alert("先貼上 Key（在 Linear → Settings → Security & access → Personal API keys 建立）");return}
 const r=await fetch("/api/prefs",{method:"PATCH",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({linear_api_key:v})});
 document.getElementById("p_msg").textContent=r.ok?" Key 已儲存 ✓（5 分鐘內生效）":" 儲存失敗";
 if(r.ok)setTimeout(loadPrefs,600);
}
async function loadNotes(){
 const box=document.getElementById("notes");
 const r=await fetch("/api/notes");
 if(!r.ok){box.innerHTML="";return}
 const ns=await r.json();
 box.innerHTML=ns.map(n=>`
  <div class="card"><div class="row">
   <div style="flex:1;white-space:pre-wrap">${esc(n.text)}</div>
   <button class="del" onclick="delNote('${esc(n.id)}')">撕掉</button>
  </div></div>`).join("");
}
async function addNote(){
 const el=document.getElementById("nt");
 const v=el.value.trim();
 if(!v)return;
 const r=await fetch("/api/notes",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({text:v})});
 if(r.ok){el.value="";loadNotes()}
}
async function delNote(id){await fetch("/api/notes/"+id,{method:"DELETE"});loadNotes()}
load();
loadCals();
loadPrefs();
loadNotes();
</script></body></html>
