<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>deskbar 鬧鐘</title>
<style>
*{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden}
html{scroll-behavior:smooth;scroll-padding-top:60px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
*:focus-visible{outline:2px solid #78beff;outline-offset:2px}
body{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;background:#111;color:#eee;
 max-width:1040px;margin:0 auto;padding:20px;width:100%}
h1{font-size:20px;font-weight:600}
.sticky-nav{position:sticky;top:0;z-index:100;background:rgba(17,17,17,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;gap:8px;align-items:center;overflow-x:auto;padding:8px 0;margin:10px 0 16px;max-width:100%}
.nav-pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:22px;background:#2a2a2a;color:#eee;text-decoration:none;font-size:14px;font-weight:500;border:1px solid #444;flex:0 0 auto;white-space:nowrap}
.nav-pill:hover,.nav-pill:focus-visible{background:#3a3a3a;color:#fff}
.card{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:14px;margin:10px 0;min-width:0;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.alarm-row{align-items:flex-start;flex-wrap:wrap}
.alarm-row>div:first-child{flex:1 1 130px;min-width:0}
.alarm-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:0 1 auto;flex-wrap:wrap}
.alarm-editor-status{color:#78beff;font-size:14px;margin:8px 0;min-height:20px}
.time{font-size:28px;font-variant-numeric:tabular-nums}
.days,.label{color:#9a9a9a;font-size:13px}
button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 14px;min-height:44px}
button:disabled{opacity:.55;cursor:progress}
button.del{color:#f09595}
input,label.d{font-size:16px}
input[type=time]{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:6px}
input[type=text],input[type=password],input[type=number],textarea,select{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;min-height:44px;max-width:100%;min-width:0}
input[type=text],input[type=password],textarea{width:100%;box-sizing:border-box}
textarea{resize:vertical;line-height:1.4}
.wk{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.wk label{background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:14px}
.wk input{margin-right:4px}
.off{opacity:.45}
h2{font-size:16px;font-weight:600;margin:24px 0 8px}
.cal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #2a2a2a;flex-wrap:wrap}
.cal-row:first-of-type{border-top:none}
.cal-row label{font-size:15px;flex:1}
.cal-row input{width:20px;height:20px}
.scene-options{display:flex;flex-wrap:wrap;gap:6px 14px}
.scene-options label{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-height:44px;padding:6px 0;white-space:nowrap;cursor:pointer}
.scene-options input{flex:0 0 auto;margin:0}
.acc-email{color:#9a9a9a;font-size:13px;margin-top:-4px}
.hint{color:#777;font-size:12px;margin:10px 2px 0}
.usage-sources{border:0;border-top:1px solid #2a2a2a;margin:14px 0 0;padding:12px 0 0;min-width:0}
.usage-sources legend{font-size:15px;font-weight:600;padding:0}
.usage-source-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.usage-source-list label{display:flex;align-items:center;gap:7px;min-height:44px;padding:8px 10px;border:1px solid #444;border-radius:8px;cursor:pointer}
.usage-source-list input{width:20px;height:20px;margin:0}
.legacy-usage-wrapper{margin-top:14px;min-width:0}
.legacy-usage-wrapper summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#bbb}
.usage-manager{border-top:1px solid #2a2a2a;margin-top:14px;padding-top:14px;min-width:0}
.usage-manager-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.usage-manager-title{font-weight:700;font-size:16px}
.usage-actions,.usage-card-actions,.usage-form-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.usage-source-status{font-size:13px;color:#9ecfff;min-height:20px;margin:6px 0;overflow-wrap:anywhere}
.usage-source-status.error,.usage-form-msg.error{color:#f09595}
.usage-auth-panel,.usage-add-panel{border:1px solid #3d4c5b;background:#171f26;border-radius:8px;padding:10px;margin:10px 0;min-width:0}
.usage-auth-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.usage-auth-row input{flex:1 1 220px}
.usage-grid{display:grid;grid-template-columns:1fr;gap:10px;min-width:0}
.usage-card{background:#181818;border:1px solid #333;border-left:5px solid #777;border-radius:8px;padding:12px;min-width:0;overflow-wrap:anywhere}
.usage-provider-openai{border-left-color:#67c8ff}
.usage-provider-claude{border-left-color:#f5a76c}
.usage-provider-antigravity{border-left-color:#a2d86f}
.usage-provider-custom{border-left-color:#c8aaff}
.usage-card-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.usage-card-identity{display:flex;flex-direction:column;gap:4px;min-width:0}
.usage-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.usage-sub{color:#aaa;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.usage-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.status-pill{display:inline-flex;align-items:center;min-height:28px;border-radius:14px;padding:2px 10px;border:1px solid #555;font-size:12px}
.status-ok{color:#b7f3c5;border-color:#3e7f50;background:#162219}
.status-stale{color:#ffd299;border-color:#7b5b2e;background:#241c12}
.status-pending{color:#9ecfff;border-color:#436c91;background:#13202a}
.status-disabled{color:#ccc;border-color:#555;background:#222}
.usage-flag{color:#bbb;font-size:12px;border:1px solid #444;border-radius:14px;padding:3px 9px}
.metric-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px;min-width:0}
.metric-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid #292929;padding-top:8px;min-width:0}
.metric-value{font-variant-numeric:tabular-nums;font-weight:700}
.usage-form-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.usage-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.usage-field span,.usage-check span{font-size:13px;color:#ccc}
.usage-check{display:flex;align-items:center;gap:8px;min-height:44px;min-width:0}
.usage-check input{width:20px;height:20px;flex:0 0 auto}
.usage-metric-choices{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.usage-metric-choices label{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid #444;border-radius:8px;padding:7px 10px;min-width:0}
.usage-form-msg{font-size:13px;min-height:18px;color:#9ecfff;overflow-wrap:anywhere}
.usage-empty{border:1px dashed #444;border-radius:8px;padding:12px;color:#bbb;line-height:1.5;min-width:0}
.source-snippet{display:block;overflow-x:auto;max-width:100%;white-space:pre;background:#101820;border:1px solid #344454;border-radius:8px;padding:10px;color:#dbefff;font-size:12px;line-height:1.45}
.usage-token-secret{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid #4d6545;background:#142016;border-radius:8px;padding:10px;margin-top:8px;min-width:0}
.usage-token-secret code{overflow-wrap:anywhere;word-break:break-all}
.usage-source-details{margin-top:10px;min-width:0}
.usage-source-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#bbb}
.usage-source-detail-list{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin:8px 0 0;font-size:12px;color:#aaa;min-width:0}
.usage-source-detail-list dt{color:#888}
.usage-source-detail-list dd{margin:0;overflow-wrap:anywhere;word-break:break-word}
.usage-archived{margin-top:12px}
.usage-archived summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#bbb}

.note-card{display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.note-card-main{display:flex;flex-direction:column;gap:8px;width:100%}
.note-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.note-head-left{display:flex;align-items:center;gap:6px}
.note-drag-handle{width:44px;height:44px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:8px;color:#9a9a9a;font-size:18px;cursor:grab;padding:0;touch-action:none;user-select:none}
.note-drag-handle:focus-visible{border-color:#78beff}
.note-idx{color:#9a9a9a;min-width:22px;font-variant-numeric:tabular-nums;font-size:14px}
.note-actions{display:flex;gap:6px;align-items:center}
.note-actions button{min-height:44px;padding:8px 14px}
.note-body{width:100%;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;font-size:15px;line-height:1.5;color:#eee}
.note-colors{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;width:100%}
.color-btn{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0;flex:0 0 auto}
.color-btn.active,.color-btn:focus-visible{border-color:#fff}

@media(min-width:768px){
 .note-card-main{display:flex;flex-direction:row;align-items:center;gap:10px}
 .note-card-head{display:contents}
 .note-head-left{display:flex;align-items:center;gap:6px;flex:0 0 auto}
 .note-body{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
 .note-actions{flex:0 0 auto}
 .note-colors{margin-top:8px}
 .usage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .usage-form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(min-width:1200px){.usage-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:820px){.usage-manager{scroll-margin-top:72px}}
@media(min-width:1440px){body{max-width:1120px}}
@media(max-width:767px){body{max-width:480px;padding:16px}.usage-card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;align-items:stretch}.usage-card-actions button{width:100%;min-height:44px;white-space:normal;line-height:1.2;padding-inline:8px}.usage-form-actions button{flex:1 1 130px}.usage-manager-head{align-items:stretch}.usage-actions{width:100%}.usage-actions button{flex:1 1 140px}}
@media(max-width:390px){body{padding:12px}.usage-card{padding:10px}.usage-auth-row button{flex:1 1 120px}}
@media(max-width:374px){body{padding:12px}.row{align-items:stretch;flex-wrap:wrap}.row input[type=text]{min-width:0;flex:1 1 180px}.cal-row select,.cal-row input[type=text]{max-width:100%}}
@media(max-width:479px){.alarm-row{flex-direction:column}.alarm-actions{width:100%;justify-content:flex-start}.alarm-actions button{flex:1 1 132px;padding-inline:8px}}
</style></head><body>
<h1>deskbar</h1>
<nav class="sticky-nav" aria-label="頁面快速導航">
 <a href="#sec-notes" class="nav-pill">便條</a>
 <a href="#sec-alarms" class="nav-pill">鬧鐘</a>
 <a href="#sec-cals" class="nav-pill">日曆</a>
 <a href="#sec-prefs" class="nav-pill">設定</a>
</nav>
<h2 id="sec-notes" style="margin-top:8px">便條</h2>
<div class="card">
 <div class="row"><input type="text" id="nt" placeholder="閃念丟這裡，Enter 上牆"
  onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)addNote()">
 <button onclick="addNote()">上牆</button></div>
 <div class="hint">Mac 終端機：note 指令兩秒上牆（設定方式問 Claude）</div>
</div>
<div id="notes"></div>
<h2 id="sec-alarms">鬧鐘</h2>
<div id="list"></div>
<div class="card">
 <div class="row"><input type="time" id="t" value="09:00"><input type="text" id="lb" placeholder="標籤（例如：打卡）"></div>
 <div class="wk" id="wk"></div>
 <label class="d"><input type="checkbox" id="arrival"> 手機到場後才提醒</label>
 <div id="alarm-editor-status" class="alarm-editor-status" aria-live="polite"></div>
 <div class="row"><button id="save-alarm" onclick="saveAlarm()">新增鬧鐘</button><button id="cancel-edit" onclick="cancelEdit()" hidden>取消編輯</button></div>
</div>
<h2 id="sec-cals">日曆</h2>
<div id="cals"></div>
<h2 id="sec-prefs">裝置設定</h2>
<div id="prefs"></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["一","二","三","四","五","六","日"];
const wk=document.getElementById("wk");
let alarms=[];
let editingAlarmId=null;
WD.forEach((w,i)=>{wk.insertAdjacentHTML("beforeend",
 `<label class="d"><input type="checkbox" value="${i}">${w}</label>`)});
async function load(){
 const as=await (await fetch("/api/alarms")).json();
 alarms=as;
 const td=new Date().toLocaleDateString("sv-SE");
 document.getElementById("list").innerHTML=as.map(a=>{
  const sk=a.skip_date===td;
  const off=!a.enabled||sk;
  const dt=(a.days.length?a.days.map(d=>"週"+WD[d]).join(" "):"一次性")+(a.arrival_trigger?"（到場後提醒）":"")+(sk?"（今天略過）":"");
  const sb=a.days.length?`<button onclick="skip('${esc(a.id)}',${sk?null:`'${td}'`})">${sk?"取消略過":"今天略過"}</button>`:"";
  return `<div class="card ${off?"off":""}"><div class="row alarm-row">
   <div><div class="time">${esc(a.time)}</div>
   <div class="label">${esc(a.label)}</div>
   <div class="days">${dt}</div></div>
   <div class="alarm-actions"><button onclick="editAlarm('${esc(a.id)}')">編輯</button>${sb}<button onclick="arrival('${esc(a.id)}',${!a.arrival_trigger})">${a.arrival_trigger?"改準時提醒":"改到場後提醒"}</button><button onclick="tog('${esc(a.id)}',${!a.enabled})">${a.enabled?"停用":"啟用"}</button>
   <button class="del" onclick="del('${esc(a.id)}')">刪除</button></div>
  </div></div>`;
 }).join("")||'<div class="card">尚無鬧鐘</div>';
}
function editorStatus(){return document.getElementById("alarm-editor-status")}
function editAlarm(id){
 const a=alarms.find(x=>x.id===id); if(!a)return;
 editingAlarmId=id;
 document.getElementById("t").value=a.time;
 document.getElementById("lb").value=a.label;
 document.getElementById("arrival").checked=!!a.arrival_trigger;
 wk.querySelectorAll("input").forEach(x=>x.checked=a.days.includes(+x.value));
 document.getElementById("save-alarm").textContent="儲存變更";
 document.getElementById("cancel-edit").hidden=false;
 editorStatus().textContent=`正在編輯 ${a.time}・${a.label}`;
 document.getElementById("t").focus();
}
function cancelEdit(){
 editingAlarmId=null;
 document.getElementById("save-alarm").textContent="新增鬧鐘";
 document.getElementById("cancel-edit").hidden=true;
 editorStatus().textContent="";
 document.getElementById("lb").value="";
 document.getElementById("arrival").checked=false;
 wk.querySelectorAll("input").forEach(x=>x.checked=false);
}
async function saveAlarm(){
 const days=[...wk.querySelectorAll("input:checked")].map(x=>+x.value);
 const payload={time:document.getElementById("t").value,days,
  label:document.getElementById("lb").value,arrival_trigger:document.getElementById("arrival").checked};
 const url=editingAlarmId?"/api/alarms/"+editingAlarmId:"/api/alarms";
 const r=await fetch(url,{method:editingAlarmId?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
 if(!r.ok){alert("格式錯誤，請確認時間與星期");return} cancelEdit();load();
}
async function tog(id,en){await fetch("/api/alarms/"+id,{method:"PATCH",
 headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:en})});load()}
async function skip(id,d){await fetch("/api/alarms/"+id,{method:"PATCH",
 headers:{"Content-Type":"application/json"},body:JSON.stringify({skip_date:d})});load()}
async function arrival(id,on){await fetch("/api/alarms/"+id,{method:"PATCH",
 headers:{"Content-Type":"application/json"},body:JSON.stringify({arrival_trigger:on})});load()}
async function del(id){await fetch("/api/alarms/"+id,{method:"DELETE"});load()}
async function loadCals(){
 const box=document.getElementById("cals");
 const r=await fetch("/api/calendars");
 if(!r.ok){box.innerHTML='<div class="card">此功能需重新部署後啟用</div>';return}
 const accs=await r.json();
 box.innerHTML=(accs.map(a=>`
  <div class="card">
   <div>${esc(a.lane_label)}</div>
   <div class="acc-email">${esc(a.account)}</div>
   ${a.calendars.map(c=>`
    <div class="cal-row">
     <input type="checkbox" id="c_${esc(a.account)}_${esc(c.id)}" ${c.enabled?"checked":""}
      onchange="togCal('${esc(a.account)}','${esc(c.id)}',this.checked)">
     <label for="c_${esc(a.account)}_${esc(c.id)}">${esc(c.summary)}</label>
    </div>`).join("")}
  </div>`).join("")||'<div class="card">尚無帳號</div>')+
  '<div class="hint">變更於下次同步生效（最多 5 分鐘，可在螢幕點左下角立即同步）</div>';
}
async function togCal(account,calendarId,enabled){
 await fetch("/api/calendars",{method:"PATCH",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({account,calendar_id:calendarId,enabled})});
 loadCals();
}
const MIN_OPTS=Array.from({length:48},(_,i)=>i*30);
const fm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const sel=(id,opts,cur,f)=>`<select id="${id}">${opts.map(v=>
 `<option value="${v}" ${v===cur?"selected":""}>${f(v)}</option>`).join("")}</select>`;
async function loadPrefs(){
 const box=document.getElementById("prefs");
 const r=await fetch("/api/prefs");
 if(!r.ok){box.innerHTML='<div class="card">此功能需重新部署後啟用</div>';return}
 const p=await r.json();
 const pct=[...Array(10)].map((_,i)=>(i+1)*10);
 const spd=[[20,"快"],[30,"中"],[45,"慢"]];
 const weatherLabel=esc(p.weather_label||"—");
 box.innerHTML=`<div class="card">
  <div class="cal-row">上班開始 ${sel("p_ws",MIN_OPTS,p.work_start_min,fm)}</div>
  <div class="cal-row">下班時間 ${sel("p_we",MIN_OPTS,p.work_end_min,fm)}（此後套用下班亮度）</div>
  <div class="cal-row">上班亮度 ${sel("p_bd",pct.filter(v=>v>=10),p.brightness_day,v=>v+"%")}</div>
  <div class="cal-row">下班亮度 ${sel("p_bn",pct,p.brightness_night,v=>v+"%")}</div>
  <div class="cal-row"><input type="checkbox" id="p_wa" ${p.weather_auto_locate?"checked":""}>
   <label for="p_wa">天氣自動定位（IP，目前：${weatherLabel}）</label></div>
  <div class="cal-row">改城市 <input type="text" id="p_city" placeholder="台北"
    style="width:110px"><button onclick="setCity()">定位</button>
   <span class="hint">IP 定位在雙北常差一區，手動指定最準</span></div>
  <div class="cal-row"><input type="checkbox" id="p_se" ${p.sleep_enabled?"checked":""}>
   <label for="p_se">深夜熄屏（時段內全黑，觸摸喚醒 30 秒）</label></div>
  <div class="cal-row">睡眠時段 ${sel("p_ss",MIN_OPTS,p.sleep_start_min,fm)} –
   ${sel("p_sn",MIN_OPTS,p.sleep_end_min,fm)}</div>
  <div class="cal-row"><input type="checkbox" id="p_pe" ${p.presence_enabled?"checked":""}>
   <label for="p_pe">在場感應（需先在螢幕上完成藍牙配對）</label></div>
  <div class="cal-row">感應速度 <select id="p_pi">${spd.map(([v,n])=>
   `<option value="${v}" ${v===p.presence_interval_sec?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="cal-row">同步頻率 ${sel("p_si",[1,3,5,10,30],p.sync_interval_min,v=>v+" 分鐘")}</div>
  <div class="cal-row"><input type="checkbox" id="p_pet" ${p.pet_enabled?"checked":""}>
   <label for="p_pet">小喜喜桌面寵物（可直接在螢幕上拖曳）</label></div>
  <div class="cal-row" style="margin-top:10px"><b>氛圍場景</b>
   <select id="p_sm">${[["auto","自動（忙時進場景、閒時回便條）"],["manual","手動（只有自己切）"],
    ["force","強制（常駐場景，點畫面看 1 分鐘行事曆）"]].map(([v,n])=>
    `<option value="${v}" ${v===p.scene_mode?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="cal-row scene-options">

function usageEl(tag,attrs={},children=[]){
 const node=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(v===undefined||v===null)continue;
  if(k==="class")node.className=v;
  else if(k==="text")node.textContent=String(v);
  else if(k==="checked")node.checked=!!v;
  else if(k==="disabled")node.disabled=!!v;
  else if(k==="hidden")node.hidden=!!v;
  else if(k==="value")node.value=String(v);
  else if(k.startsWith("on")&&typeof v==="function")node.addEventListener(k.slice(2),v);
  else node.setAttribute(k,String(v));
 }
 for(const child of children){
  if(child===undefined||child===null)continue;
  node.appendChild(typeof child==="string"?document.createTextNode(child):child);
 }
 return node;
}

async function loadUsageSources({silent=false}={}){
 if(usageSourcesState.loading)return;

 if(!list)return;
 usageSourcesState.loading=true;
 if(!silent)usageStatusBox("讀取用量來源中…");
 try{
  const r=await fetch("/api/usage-sources?include_archived=1",{headers:{"Accept":"application/json"}});
  const data=await usageReadJson(r);
  if(!r.ok){
   const msg=r.status===503?"用量來源儲存目前無法讀取，請檢查裝置 log 後再重試。":
    "讀取用量來源失敗"+usageErrorSuffix(r,data);
   usageStatusBox(msg,true);
   if(!usageSourcesState.loaded)renderUsageSourcesError(msg);
   return;
  }
  usageSourcesState.loaded=true;
  usageSourcesState.sources=Array.isArray(data.sources)?data.sources:[];
  renderUsageSources();
  if(!silent)usageStatusBox("用量來源已更新");
  else usageStatusBox("");
 }catch(err){
  const msg="讀取用量來源失敗："+String(err&&err.message?err.message:err);

function renderUsageSourceCollection(container,sources,archived){
 if(!container)return;
 const cards=[...container.children].filter(el=>el.classList&&el.classList.contains("usage-card"));
 const existing=new Map();
 for(const card of cards){
  const id=card.dataset.sourceId;
  if(!id||existing.has(id)){card.remove();continue}
  existing.set(id,card);
 }
 const wanted=new Set();
 if(!sources.length){
  if(container.children.length===1&&container.firstElementChild.classList.contains("usage-empty"))return;
  usageClear(container);
  const empty=usageEl("div",{class:"usage-empty"});
  empty.appendChild(usageEl("div",{text:archived?"沒有已移除來源":"等待收集器回報。"}));
  if(!archived){
   empty.appendChild(usageEl("div",{class:"hint",text:"既有 publisher 首次回報後，新的帳號會在重新載入或自動刷新時出現。"}));
   empty.appendChild(usageEl("button",{type:"button",text:"新增來源",onclick:showAddUsageSourceForm}));
  }
  container.appendChild(empty);
  return;
 }
 for(const child of [...container.children]){
  if(child.classList&&child.classList.contains("usage-empty"))child.remove();
 }
 for(const source of sources){
  const id=String(source.source_id||"");
  if(!id)continue;
  wanted.add(id);
  const hash=usageSourceHash(source,archived);
  const mode=usageSourceMode(source,archived);
  let card=existing.get(id);
  const activeInside=card&&card.contains(document.activeElement);
  const focusedOrEditing=usageSourcesState.editingId===id||activeInside;
  const keepDraft=card&&card.dataset.mode==="editor"&&mode==="editor";
  const sourceChanged=card&&card.dataset.hash!==hash;
  const modeChanged=card&&card.dataset.mode!==mode;
  if(!card||modeChanged||(!keepDraft&&sourceChanged)){
   const nextCard=renderUsageSourceCard(source,archived,hash,mode);
   if(card){
    if(card.parentNode===container)card.replaceWith(nextCard);
    else card.remove();
   }
   card=nextCard;
   existing.set(id,card);
  }else{
   card.dataset.hash=hash;
   card.dataset.mode=mode;
   if(focusedOrEditing)updateUsageSourceCardControls(card,source,archived);
  }
  container.appendChild(card);
  removeDuplicateUsageSourceCards(container,id,card);
  updateUsageSourceCardControls(card,source,archived);
  }
 for(const card of [...container.children]){
   if(card.classList&&card.classList.contains("usage-card")&&!wanted.has(card.dataset.sourceId))card.remove();
  }
}
function removeDuplicateUsageSourceCards(container,id,keep){

function formatUsageTime(value){

function usageAge(value){
 const d=new Date(value);

 if(min<60)return min+" 分鐘前";

 const card=usageCardFor(sourceId);
 const form=card?card.querySelector("form"):null;
 if(!form)return;
 let selectedMetrics=[];
 try{selectedMetrics=parseMetricSelection(form)}catch(err){usageFormMsg(form,err.message,true);return}
 const stale=Number(form.querySelector('[name="stale_after_hours"]').value);
 const displayName=form.querySelector('[name="display_name"]').value.trim();
 if(!displayName){usageFormMsg(form,"顯示名稱不可空白",true);return}
 if(!Number.isInteger(stale)||stale<1||stale>720){usageFormMsg(form,"過期判定需為 1..720 小時",true);return}
 const body={
  display_name:displayName,
  enabled:!form.querySelector('[name="pause"]').checked,
  visible:form.querySelector('[name="visible"]').checked,
  stale_after_hours:stale,
  hide_when_stale:form.querySelector('[name="hide_when_stale"]').checked,
  selected_metrics:selectedMetrics
 };
 usageFormMsg(form,"儲存中…");
 const ok=await usagePatch(sourceId,body,()=>saveUsageSourceEdit(sourceId,button),button);
 if(ok){usageSourcesState.editingId=null;renderUsageSources();usageStatusBox("來源已儲存")}
}

function renderUsageTokenSecret(container,sourceId,token){
 usageClear(container);
 const box=usageEl("div",{class:"usage-token-secret","data-test-exclude":"token-secret"});
 box.appendChild(usageEl("span",{text:"一次性回報金鑰："}));

async function rotateUsageSourceToken(sourceId,button){
 return usageRequest("POST","/api/usage-sources/"+encodeURIComponent(sourceId)+"/token",null,
  ()=>rotateUsageSourceToken(sourceId,button),button,async data=>{
   if(!data.token){usageStatusBox("回報金鑰產生失敗：回應缺少回報金鑰",true);return}
   usageSourcesState.tokenSecrets[sourceId]=String(data.token);
   const source=usageSourcesState.sources.find(s=>s.source_id===sourceId);
   if(source)source.token_set=true;
   const output=usageCardFor(sourceId)?.querySelector("[data-token-output]");
   if(output)renderUsageTokenSecret(output,sourceId,String(data.token));
   usageStatusBox("回報金鑰已產生，請現在保存；離開或清除後不再顯示。");
  });
}
async function usagePatch(sourceId,body,retry,button){
 return usageRequest("PATCH","/api/usage-sources/"+encodeURIComponent(sourceId),body,retry,button,async data=>{
  const updated=data&&data.source;
  if(updated){
   const idx=usageSourcesState.sources.findIndex(s=>s.source_id===updated.source_id);
   if(idx>=0)usageSourcesState.sources[idx]=updated;
  }
 });
}
async function usageRequest(method,url,body,retry,button,onOk){
 if(button)button.disabled=true;
 const headers={"Accept":"application/json"};
 if(body!==null)headers["Content-Type"]="application/json";
 if(usageSourcesState.managementToken)headers["X-Deskbar-Token"]=usageSourcesState.managementToken;
 try{
  const r=await fetch(url,{method,headers,body:body===null?undefined:JSON.stringify(body)});
  const data=await usageReadJson(r);
  if(r.status===401){
   usageSourcesState.pendingRetry=retry;
   showUsageAuth("這個動作需要管理金鑰。請輸入管理金鑰後按「帶金鑰重試」。");
   return false;
  }
  if(!r.ok){
   usageStatusBox("用量來源更新失敗"+usageErrorSuffix(r,data),true);
   usageFormMsg(button?button.closest("form"):null,"更新失敗"+usageErrorSuffix(r,data),true);
   return false;
  }
  hideUsageAuth();
  await onOk(data);
  return true;
 }catch(err){
  usageStatusBox("用量來源更新失敗："+String(err&&err.message?err.message:err),true);
  return false;
 }finally{
  if(button)button.disabled=false;
 }
}

async function retryUsageManagementRequest(){
 const input=document.getElementById("usage-management-token");
 usageSourcesState.managementToken=input?input.value.trim():"";
 if(!usageSourcesState.managementToken){usageStatusBox("請先輸入管理金鑰",true);return}
 const retry=usageSourcesState.pendingRetry;
 if(!retry){usageStatusBox("請回到剛才的管理動作再試一次",true);return}
 usageSourcesState.pendingRetry=null;
 await retry();
}

async function moveUsageSource(sourceId,dir,button){
 if(usageSourcesState.orderPending)return;
 const active=[...usageSourcesState.sources].filter(s=>!s.archived).sort((a,b)=>
  (Number(a.order)||0)-(Number(b.order)||0)||String(a.created_at||"").localeCompare(String(b.created_at||"")));
 const idx=active.findIndex(s=>s.source_id===sourceId);
 const otherIdx=idx+dir;
 if(idx<0||otherIdx<0||otherIdx>=active.length)return;
 const sourceIds=active.map(s=>s.source_id);
 [sourceIds[idx],sourceIds[otherIdx]]=[sourceIds[otherIdx],sourceIds[idx]];
 usageSourcesState.orderPending=true;
 renderUsageSources();
 try{
  const ok=await usageRequest("POST","/api/usage-sources/order",{source_ids:sourceIds},
   ()=>moveUsageSource(sourceId,dir,button),button,async data=>{
    const ordered=Array.isArray(data&&data.sources)?data.sources:[];
    const archived=usageSourcesState.sources.filter(s=>s.archived);
    usageSourcesState.sources=ordered.concat(archived);
   });
  if(ok)usageStatusBox("排序已更新");
 }finally{
  usageSourcesState.orderPending=false;
  renderUsageSources();
 }
}

let NOTES=[],editingNote=null;
// 便利貼色盤（與裝置 notesview._STICKY 同一組色）；auto 輪色雜湊也與裝置同款，
// 卡片左緣色永遠等於牆上那張的顏色
const PAL=["#FFD65A","#FFA0B4","#78BEFF","#96E2A0","#C8AAFF"];
function autoIdx(id){let v=0;for(const ch of String(id)){v=(Math.imul(v,131)+ch.charCodeAt(0))>>>0}return v%PAL.length}
const noteColor=n=>PAL[(n.color>=0&&n.color<PAL.length)?n.color:autoIdx(n.id)];
async function setColor(id,ci){
 await fetch("/api/notes/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({color:ci})});
 loadNotes();
}
async function loadNotes(){
 const r=await fetch("/api/notes");
 if(!r.ok){document.getElementById("notes").innerHTML="";return}
 NOTES=await r.json();renderNotes();
}
function renderNotes(){
 document.getElementById("notes").innerHTML=NOTES.map((n,i)=>editingNote===n.id?`
  <div class="card note-card" data-id="${esc(n.id)}">
   <div class="note-body">
    <input type="text" id="ed_${esc(n.id)}" value="${esc(n.text)}"
     onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)saveEdit('${esc(n.id)}')">
   </div>
   <div class="note-actions" style="margin-top:8px;justify-content:flex-end">
    <button type="button" onclick="saveEdit('${esc(n.id)}')">存</button>
    <button type="button" onclick="editingNote=null;renderNotes()">取消</button>
   </div>
  </div>`:`
  <div class="card note-card" data-id="${esc(n.id)}" style="border-left:4px solid ${noteColor(n)}">
   <div class="note-card-main">
    <div class="note-card-head">
     <div class="note-head-left">
      <button type="button" class="note-drag-handle drag" role="button" tabindex="0" aria-label="拖曳排序" style="touch-action:none"
       onpointerdown="dragStart(event)" onkeydown="if(event.key==='Enter'||event.key===' ')event.preventDefault()">☰</button>
      <span class="note-idx">${i+1}.</span>
     </div>
     <div class="note-actions">
      <button type="button" onclick="editingNote='${esc(n.id)}';renderNotes()">編輯</button>
      <button type="button" class="del" onclick="delNote('${esc(n.id)}')">撕掉</button>
     </div>
    </div>
    <div class="note-body">${esc(n.text)}</div>
   </div>
   <div class="note-colors">
    ${PAL.map((c,ci)=>`<button type="button" class="color-btn ${n.color===ci?"active":""}" aria-label="顏色 ${ci+1}" onclick="setColor('${esc(n.id)}',${ci})" style="background:${c};border:2px solid ${n.color===ci?"#fff":"rgba(255,255,255,.15)"}"></button>`).join("")}
   </div>
  </div>`).join("");
 const el=document.getElementById("ed_"+editingNote);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
// 拖動排序（順序＝優先序，第 1 張＝deskbar 牆左上）。用 Pointer Events 手做
// ——HTML5 DnD 在手機瀏覽器不動；把手 touch-action:none，其餘區域照常捲頁。
let dragEl=null;
function dragStart(e){
 if(editingNote)return;
 dragEl=e.target.closest(".note-card");
 dragEl.style.opacity=.55;
 e.preventDefault();
}
document.addEventListener("pointermove",e=>{
 if(!dragEl)return;
 e.preventDefault();
 for(const el of document.querySelectorAll(".note-card")){
  if(el===dragEl)continue;
  const r=el.getBoundingClientRect();
  if(e.clientY<r.top+r.height/2){el.before(dragEl);return}
 }
 const all=[...document.querySelectorAll(".note-card")];
 if(all.length)all[all.length-1].after(dragEl);
},{passive:false});
document.addEventListener("pointerup",async()=>{
 if(!dragEl)return;
 dragEl.style.opacity=1;dragEl=null;
 const order=[...document.querySelectorAll(".note-card")].map(el=>el.dataset.id);
 await fetch("/api/notes/reorder",{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({order})});
 loadNotes();
});
